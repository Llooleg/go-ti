<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>go-ti · Threat Intelligence</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <h1><span class="logo">&#9670;</span> go-ti</h1>
      <p class="tagline">Threat intelligence lookup &mdash; VirusTotal + AbuseIPDB</p>
    </header>

    <form id="lookup-form">
      <input id="target" type="text" placeholder="https://example.com  ·  /path/to/file"
             autocomplete="off" autofocus spellcheck="false" aria-label="Link or file path">
      <button id="analyze-btn" type="submit">Analyze</button>
    </form>
    <p class="hint">
      Links are scanned with VirusTotal and their IP is checked on AbuseIPDB.
      Files are hashed (SHA-256) on the <strong>server</strong> and looked up on VirusTotal.
    </p>

    <section id="status" class="status" hidden></section>
    <section id="report" hidden></section>
  </main>

  <footer>go-ti &mdash; educational project, not for production use</footer>

  <script src="/static/app.js"></script>
</body>
</html>
